<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111214">
<title>Load the Bar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
<section id="bar-page">
<h1>Load the Bar</h1>
<div class="seg" id="mode">
  <button data-m="kg">KG</button><button data-m="lb">LB</button>
</div>

<div class="fig"><svg id="bar" viewBox="0 0 400 250" role="img" aria-label="Loaded barbell, one side"></svg></div>

<div class="total" id="total"></div>
<div class="alt" id="alt"></div>
<div class="note" id="note"></div>

<div class="entry">
  <button class="step" id="minus" aria-label="Decrease">−</button>
  <div class="box">
    <input id="target" inputmode="decimal" autocomplete="off" aria-label="Target weight">
    <span class="unit" id="unit"></span>
  </div>
  <button class="step" id="plus" aria-label="Increase">+</button>
</div>

<div class="pad" id="pad"></div>
</section>
<section id="calc" hidden>
<h1>Calculator</h1>
<div class="cin">
  <span>Bodyweight</span>
  <div class="box wide"><input id="c-bw" inputmode="decimal" autocomplete="off" aria-label="Bodyweight"><button class="unit" data-u="bw"></button></div>
  <span>Squat</span>
  <div class="box"><input id="c-sq" inputmode="decimal" autocomplete="off" aria-label="Squat"><button class="unit" data-u="sq"></button></div>
  <div class="box r"><input id="c-sqr" inputmode="numeric" autocomplete="off" aria-label="Squat reps"></div>
  <span>Bench</span>
  <div class="box"><input id="c-bp" inputmode="decimal" autocomplete="off" aria-label="Bench"><button class="unit" data-u="bp"></button></div>
  <div class="box r"><input id="c-bpr" inputmode="numeric" autocomplete="off" aria-label="Bench reps"></div>
  <span>Deadlift</span>
  <div class="box"><input id="c-dl" inputmode="decimal" autocomplete="off" aria-label="Deadlift"><button class="unit" data-u="dl"></button></div>
  <div class="box r"><input id="c-dlr" inputmode="numeric" autocomplete="off" aria-label="Deadlift reps"></div>
  <span>Total</span>
  <div class="box wide"><input id="c-t" inputmode="decimal" autocomplete="off" aria-label="Total"><button class="unit" data-u="t"></button></div>
</div>
<div class="res">
  <div><b data-o="x"></b><span>× BW</span></div>
  <div><b data-o="dots"></b><span>DOTS</span></div>
  <div><b data-o="glp"></b><span>GLP</span></div>
</div>
</section>
<section id="history" hidden><h1>History</h1></section>
<section id="proj" hidden>
<h1>Projection</h1>
<div class="seg three" id="p-lift">
  <button data-l="sq">Squat</button><button data-l="bp">Bench</button><button data-l="dl">Deadlift</button>
</div>
<div class="plog">
  <div class="box"><input id="p-w" inputmode="decimal" autocomplete="off" placeholder="Weight" aria-label="Weight lifted"><button class="unit" id="p-u"></button></div>
  <div class="box r"><input id="p-r" inputmode="numeric" autocomplete="off" aria-label="Reps"></div>
  <input type="date" id="p-d" aria-label="Date of the set">
  <button class="go" id="p-add">Log set</button>
</div>
<div class="res">
  <div><b id="p-now"></b><span>1RM now</span></div>
  <div><b id="p-rate"></b><span id="p-rate-u">per month</span></div>
  <div><b id="p-at"></b><span id="p-at-d">on date</span></div>
</div>
<label class="pon">Project to <input type="date" id="p-t"></label>
<div class="pread" id="p-read"></div>
<div class="fig chart"><svg id="p-chart" viewBox="0 0 400 220" role="img" aria-label="Estimated 1RM over time with projected trend"></svg></div>
<div class="note" id="p-note"></div>
<ul class="plist" id="p-list"></ul>
</section>

</main>

<nav class="tabs" id="tabs">
  <span class="ind"></span>
  <button data-p="bar-page" aria-label="Bar"><svg viewBox="0 0 24 24"><path d="M2 12h20M5 8v8M8 6v12M16 6v12M19 8v8"/></svg></button>
  <button data-p="calc" aria-label="Calculator"><svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M8 6h8M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15h.01M8 19h.01M12 19h.01M16 19h.01"/></svg></button>
  <button data-p="history" aria-label="History"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 3"/></svg></button>
  <button data-p="proj" aria-label="Projection"><svg viewBox="0 0 24 24"><path d="M3 20h18M4 16l5-5 4 3 7-8M15 6h5v5"/></svg></button>
</nav>

<script src="dist/app.js"></script>
</body>
</html>
