<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111214">
<title>Load the Bar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
<section id="bar-page">
<h1>Load the Bar</h1>
<div class="seg" id="mode">
  <button data-m="kg">KG</button><button data-m="lb">LB</button>
</div>

<div class="fig"><svg id="bar" viewBox="0 0 400 250" role="img" aria-label="Loaded barbell, one side"></svg></div>

<div class="total" id="total"></div>
<div class="alt" id="alt"></div>
<div class="note" id="note"></div>

<div class="entry">
  <button class="step" id="minus" aria-label="Decrease">−</button>
  <div class="box">
    <input id="target" inputmode="decimal" autocomplete="off" aria-label="Target weight">
    <span class="unit" id="unit"></span>
  </div>
  <button class="step" id="plus" aria-label="Increase">+</button>
</div>

<div class="pad" id="pad"></div>
</section>
<section id="calc" hidden>
<h1>Calculator</h1>
<div class="seg" data-k="sex"><button data-v="m">M</button><button data-v="f">F</button></div>
<div class="seg four" data-k="lift">
  <button data-v="s">Squat</button><button data-v="b">Bench</button><button data-v="d">Deadlift</button><button data-v="t">Total</button>
</div>
<div class="cin">
  <div class="box bw"><input id="c-bw" inputmode="decimal" autocomplete="off" placeholder="Bodyweight" aria-label="Bodyweight"><span class="unit"></span></div>
  <div class="box"><input id="c-w" inputmode="decimal" autocomplete="off" placeholder="Weight" aria-label="Weight"><span class="unit"></span></div>
  <div class="box"><input id="c-reps" inputmode="numeric" autocomplete="off" placeholder="Reps" aria-label="Reps"></div>
</div>
<div class="res">
  <div><b data-o="max"></b><span>e1RM</span></div>
  <div><b data-o="x"></b><span>× BW</span></div>
  <div><b data-o="dots"></b><span>DOTS</span></div>
  <div><b data-o="glp"></b><span>GLP</span></div>
</div>
</section>
<section id="history" hidden><h1>History</h1></section>
<section id="settings" hidden><h1>Settings</h1></section>

</main>

<nav class="tabs" id="tabs">
  <span class="ind"></span>
  <button data-p="bar-page" aria-label="Bar"><svg viewBox="0 0 24 24"><path d="M2 12h20M5 8v8M8 6v12M16 6v12M19 8v8"/></svg></button>
  <button data-p="calc" aria-label="Calculator"><svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M8 6h8M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15h.01M8 19h.01M12 19h.01M16 19h.01"/></svg></button>
  <button data-p="history" aria-label="History"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 3"/></svg></button>
  <button data-p="settings" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg></button>
</nav>

<script src="dist/app.js"></script>
</body>
</html>
